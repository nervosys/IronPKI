[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Every crate in the graph is first-party IronSecurity code.
allow = ["AGPL-3.0-or-later"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
