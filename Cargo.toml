[package]
name = "ironpki"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "The IronSecurity stack's certificate layer: one X.509 path validator and issuer over IronCrypto"
repository = "https://github.com/nervosys/IronPKI"
readme = "README.md"
keywords = ["x509", "pki", "certificates", "cryptography"]
categories = ["cryptography", "no-std"]
# A scaffold: not for publication until a validator is extracted into it.
publish = false

[dependencies]
# IronCrypto supplies every primitive and every encoding of one. 0.2.20 is the
# minimum: it is the first release with the Poly1305 fix (GHSA-xr22-8pqp-gwfh)
# and the first whose ic-sig this crate was written against.
ic-core = { version = ">=0.2.20, <0.3", default-features = false }
ic-sig = { version = ">=0.2.20, <0.3", default-features = false }
ic-pkix = { version = ">=0.2.20, <0.3", default-features = false }
ic-hash = { version = ">=0.2.20, <0.3", default-features = false }

# The tests issue the chains they validate, with software keys.
[dev-dependencies]
ic-drbg = { version = ">=0.2.20, <0.3", features = ["std"] }
ic-ec = { version = ">=0.2.20, <0.3" }
ic-rsa = { version = ">=0.2.20, <0.3" }
ic-mldsa = { version = ">=0.2.20, <0.3" }

[features]
default = ["std"]
std = ["ic-core/std", "ic-sig/std", "ic-pkix/std", "ic-hash/std"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
