[package]
name = "ironpki"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "X.509 path validation, CRLs, OCSP responses and issuance in pure Rust over IronCrypto, for TLS and TPM endorsement-key certificates"
repository = "https://github.com/nervosys/IronPKI"
readme = "README.md"
keywords = ["x509", "pki", "certificates", "cryptography"]
categories = ["cryptography", "no-std"]
# The export notice was sent and recorded on 2026-10-10: docs/export/.
publish = true

[dependencies]
# IronCrypto supplies every primitive and every encoding of one. 0.3.1 is the
# minimum: from 0.3.0 its hashes refuse once the module is in its error
# state, as everything else did, and 0.3.1 clears vector registers and dead
# stack after code that handles secrets.
ic-core = { version = "0.3.1", default-features = false }
ic-sig = { version = "0.3.1", default-features = false }
ic-pkix = { version = "0.3.1", default-features = false }
ic-hash = { version = "0.3.1", default-features = false }

# The tests issue the chains they validate. Signing is ic-sig's; ic-rsa is
# here to generate RSA keys, and ic-drbg for randomness.
[dev-dependencies]
ic-drbg = { version = "0.3.1", features = ["std"] }
ic-rsa = { version = "0.3.1" }
# For reading the JSON vector file.
ic-json = { version = "0.3.1" }

[features]
default = ["std"]
std = ["ic-core/std", "ic-sig/std", "ic-pkix/std", "ic-hash/std"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
