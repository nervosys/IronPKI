[package]
name = "ironpki"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "The IronSecurity stack's certificate layer: one X.509 path validator and issuer over IronCrypto"
repository = "https://github.com/nervosys/IronPKI"
readme = "README.md"
keywords = ["x509", "pki", "certificates", "cryptography"]
categories = ["cryptography", "no-std"]
# A scaffold: not for publication until a validator is extracted into it.
publish = false

[dependencies]

[features]
default = ["std"]
std = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
