[package]
name = "ironpki"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "X.509 path validation, CRLs, OCSP responses and issuance in pure Rust over IronCrypto, for TLS and TPM endorsement-key certificates"
repository = "https://github.com/nervosys/IronPKI"
readme = "README.md"
keywords = ["x509", "pki", "certificates", "cryptography"]
categories = ["cryptography", "no-std"]
# The export notice was sent and recorded on 2026-10-10: docs/export/.
publish = true

[dependencies]
# IronCrypto supplies every primitive and every encoding of one. 0.2.21 is the
# minimum: its ic-sig has the software signer the tests issue chains with,
# and it is past the Poly1305 fix of 0.2.20 (GHSA-xr22-8pqp-gwfh).
ic-core = { version = ">=0.2.21, <0.3", default-features = false }
ic-sig = { version = ">=0.2.21, <0.3", default-features = false }
ic-pkix = { version = ">=0.2.21, <0.3", default-features = false }
ic-hash = { version = ">=0.2.21, <0.3", default-features = false }

# The tests issue the chains they validate. Signing is ic-sig's; ic-rsa is
# here to generate RSA keys, and ic-drbg for randomness.
[dev-dependencies]
ic-drbg = { version = ">=0.2.21, <0.3", features = ["std"] }
ic-rsa = { version = ">=0.2.21, <0.3" }
# For reading the JSON vector file.
ic-json = { version = ">=0.2.21, <0.3" }

[features]
default = ["std"]
std = ["ic-core/std", "ic-sig/std", "ic-pkix/std", "ic-hash/std"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
